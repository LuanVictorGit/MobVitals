# ==============================================================================
# MobVitals - Configuration File
# Real-time packet-based health indicators and cinematic death animations.
# Compatible with Paper, Spigot, and Folia (Minecraft 1.16.5 - 26.2+).
# Author: lHawk_ | Discord: https://minebuilders.com.br/discord
# ==============================================================================

# General settings
general:
  # Master switch for the plugin features.
  enabled: true
  # Maximum radius in blocks within which players can see health indicators and death effects.
  # Recommended: 24.0 to 48.0.
  view-distance: 32.0
  # Frequency in server ticks for synchronizing indicator positions with moving entities.
  # Lower values mean smoother movement; higher values conserve CPU ticks.
  # Default: 2 (runs 10 times per second).
  update-interval-ticks: 2

# Floating health indicator settings (rendered 100% via PacketEvents)
indicators:
  # Whether floating health indicators are enabled.
  enabled: true
  # Vertical offset in blocks above the entity bounding box height.
  # Default: 0.35 blocks.
  height-offset: 0.35
  # Whether health indicators should appear above players.
  show-for-players: true
  # Whether health indicators should appear above hostile monsters.
  show-for-monsters: true
  # Whether health indicators should appear above passive animals.
  show-for-animals: true
  # Whether health indicators should appear above villagers and wandering traders.
  show-for-villagers: true
  # Whether health indicators should appear above bosses (Withers, Wardens, Ender Dragons).
  show-for-bosses: true
  # If true, the main health bar appears only when an entity takes damage or heals, auto-hiding after a timeout.
  # When false, the bar is shown continuously.
  # Default: true.
  show-only-when-damaged: true
  # Seconds the main health bar stays visible after damage or healing before disappearing.
  # Default: 4.0 seconds.
  damaged-display-seconds: 4.0
  # Number of segments in the visual health bar.
  bar-length: 10
  # Symbol used for filled health segments.
  symbol-full: "❙"
  # Symbol used for empty health segments.
  symbol-empty: "❙"
  # Color tag for high health (>= 75%). Uses Adventure MiniMessage format.
  color-high: "<green>"
  # Color tag for medium health (50% - 74%).
  color-medium: "<yellow>"
  # Color tag for low health (25% - 49%).
  color-low: "<gold>"
  # Color tag for critical health (< 25%).
  color-critical: "<red>"
  # Color tag for empty segments in the health bar.
  color-empty: "<dark_gray>"
  # Indicator format for general mobs.
  # Placeholders: <name>, <bar>, <color>, <current>, <max>, <percent>
  format: "<white><bold><name></bold></white> <bar> <color><current><reset><dark_gray>/</dark_gray><gray><max></gray> <red>❤</red>"
  # Indicator format for players.
  player-format: "<gold><bold><name></bold></gold> <bar> <color><current><reset><dark_gray>/</dark_gray><gray><max></gray> <red>❤</red>"
  # Indicator format for boss mobs.
  boss-format: "<light_purple><bold><name></bold></light_purple> <bar> <color><current><reset><dark_gray>/</dark_gray><gray><max></gray> <red>❤</red> <yellow>(<percent>%)</yellow>"
  # Entity types that should NEVER display a health indicator.
  # Single entities can be excluded too: the scoreboard tag (or plugin metadata) "mobvitals-hide-indicator"
  # removes the bar and "mobvitals-hide-popups" the popups. ZombieGladiators sets them on the gladiators it
  # already draws itself, so each one keeps a single bar and one popup per hit.
  blacklist:
    - "ARMOR_STAND"
    - "ITEM_FRAME"
    - "GLOW_ITEM_FRAME"
    - "MARKER"
    - "PAINTING"
    - "INTERACTION"
    - "TEXT_DISPLAY"
    - "BLOCK_DISPLAY"
    - "ITEM_DISPLAY"

# Floating damage and heal variation popups (rendered 100% via PacketEvents)
variation-popups:
  # Master toggle for floating damage and heal difference popups.
  enabled: true
  # Seconds the floating popup drifts upward before vanishing.
  # Recommended: 1.2 to 2.5. Default: 1.8.
  duration-seconds: 1.8
  # Format for damage loss popups.
  # Placeholders: <value>
  damage-format: "<red>-<bold><value></bold> <dark_red>❤</dark_red>"
  heal-format: "<green>+<bold><value></bold> <green>❤</green>"
  threshold: 0.1
  # Popups of each kind (damage / heal) shown at once above one entity. A new hit or heal replaces the oldest,
  # so 1 keeps a single damage and a single heal number in the air. 0 = no limit.
  max-per-entity: 1

# Cinematic death animation and lying corpse settings (rendered 100% via PacketEvents)
death-animation:
  # Master switch for the cinematic death system.
  enabled: true
  # Duration in seconds the entity stays lying horizontally on the ground as a corpse before vanishing.
  # Valid range: 1.0 to 15.0. Default: 4.0.
  corpse-duration-seconds: 4.0
  # Whether to retain the client-side corpse lying sideways on the ground.
  # Works by delaying the entity removal packet until the corpse duration expires.
  enable-corpse-body: true
  # Whether to emit ambient particles centered on the corpse body.
  enable-ambient-particles: true
  # Interval in ticks between ambient corpse particle pulses.
  # Default: 4 ticks (5 times per second).
  ambient-particle-rate-ticks: 4
  # Whether dense clusters of corpses dissipate progressively faster to prevent clutter.
  dense-corpse-reduction: true
  # Radius in blocks used to detect neighboring corpses for cluster dissipation.
  # Default: 4.0 blocks.
  dense-radius: 4.0
  # Whether to play a dramatic particle explosion when the corpse finally vanishes.
  enable-final-explosion: true
  # Whether to play cinematic sound effects during the death animation and dissipation.
  enable-sound-effects: true
  # Whether players also leave a lying corpse upon dying.
  enable-for-players: true

# Player-facing messages formatted using Adventure MiniMessage.
# Legacy color codes (§ or &) are strictly forbidden.
messages:
  prefix: "<dark_gray>[<gradient:#FF5555:#FFAA00>MobVitals</gradient>]<reset> "
  reloaded: "<green>Configuration and death visual profiles reloaded successfully.</green>"
  toggled-on: "<green>Health indicators are now <bold>ENABLED</bold> for your view.</green>"
  toggled-off: "<yellow>Health indicators are now <bold>DISABLED</bold> for your view.</yellow>"
  no-permission: "<red>You do not have permission to execute this command.</red>"
  player-only: "<red>This command can only be executed by in-game players.</red>"
  unknown-profile: "<red>Unknown death profile '<white><profile></white>'. Available: <yellow><profiles></yellow></red>"
  test-started: "<green>Playing cinematic death animation preview for profile <gold><profile></gold> at your position.</green>"
  status-info: "<gradient:#FF5555:#FFAA00><bold>MobVitals Status</bold></gradient>:\n <gray>• Active Indicators:</gray> <yellow><active_indicators></yellow>\n <gray>• Active Corpses:</gray> <yellow><active_corpses></yellow>\n <gray>• Active Popups:</gray> <yellow><active_popups></yellow>\n <gray>• Tracked Viewers:</gray> <yellow><viewers></yellow>"
